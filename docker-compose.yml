name: xiaoai-llm-router
services:
  router:
    build: .
    image: xiaoai-llm-router:local
    env_file:
      - .env
    environment:
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - speaker-state:/home/router/.local/state/xiaoai-router
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
volumes:
  speaker-state:
