# Copy to config.yaml. Keep account credentials and API keys in .env.
mi:
  username: ''
  password: ''
  device_id: ''          # MiNA deviceID; list with --list-devices
  # devices:            # Optional: multiple MiNA deviceIDs
  #   - YOUR_MINA_DEVICE_ID
  conversation_source: cloud
  token_path: ~/.mi.token

miservice:
  ingest: conversation  # Direct MiService library; no separate HTTP gateway needed

llm:
  default_provider: deepseek
  stream: false         # Recommended for the paced MIoT speech path
  timeout_seconds: 60
  deepseek:
    model: deepseek-chat
    base_url: https://api.deepseek.com
  ollama:
    model: qwen2.5:7b
    base_url: http://localhost:11434
  openai:
    model: gpt-4o-mini

session:
  ttl_seconds: 600
  max_turns: 10

trigger:
  wake_words: ['问问AI', '问问 AI', '深思']

tts:
  method: miot
  answer_prefix: 'Deepseek 回答：'
  max_chunk_chars: 60
  chars_per_second: 3.5
  safety_margin_seconds: 1.0  # Wait estimate: chunk characters / rate + margin
  stop_music_before_speech: []  # Add deviceIDs here to stop music before speech

# Optional: directory must already exist and be writable by the service user.
# Records contain token counts and request identifiers, without conversation text.
# usage:
#   log_path: /path/to/writable/usage.jsonl
